name: Build and push MetaMCP image

# Builds the MetaMCP image from UNMODIFIED upstream source at the SHA
# pinned in Dockerfile (METAMCP_SOURCE_SHA), on a native linux/amd64
# runner, and pushes it to ghcr.io/cristoslc/metamcp. Tagged with the
# sha-prefix of the pinned source SHA and :latest.
#
# Canonical Dockerfile: private Homelab repo
# services/ai-chatbot/metamcp/Dockerfile (RUNBOOK-016 Path B). This vendored
# copy must be identical; CI fails loud if it drifts from the upstream
# build recipe (see test in Homelab).
#
# Trigger: manual (workflow_dispatch). Flow per RUNBOOK-016:
#   1. Bump METAMCP_SOURCE_SHA in Dockerfile (both copies) + commit
#   2. Run this workflow
#   3. Record the linux/amd64 manifest digest from the job summary
#   4. Bump the digest in Homelab services/ai-chatbot/metamcp/docker-compose.yml

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/metamcp

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert Dockerfile pins a base image digest
        run: |
          # Path D: thin extension of the Umbrella fork image (digest-pinned
          # FROM) — not a source build. Older Path B source-build Dockerfiles
          # pinned ARG METAMCP_SOURCE_SHA instead; either guard is valid,
          # exactly one must be present. (macOS grep lacks -P; use sed.)
          BASE=$(grep -E '^FROM ghcr\.io/umbrella-it-group/metamcp@sha256:[0-9a-f]{64}' Dockerfile \
            | head -1 | sed -E 's/^FROM ghcr.io\/umbrella-it-group\/metamcp@//')
          SHA=$(grep -E '^ARG METAMCP_SOURCE_SHA=[0-9a-f]{40}' Dockerfile \
            | head -1 | sed -E 's/^ARG METAMCP_SOURCE_SHA=//')
          if [ -z "$BASE" ] && [ -z "$SHA" ]; then
            echo "Dockerfile must pin either a digest-pinned Umbrella FROM or ARG METAMCP_SOURCE_SHA=<40-hex>"
            exit 1
          fi
          if [ -n "$BASE" ]; then
            echo "Path D: base = $BASE"
            echo "TAG=${BASE:19:10}" >> "$GITHUB_ENV"
          else
            echo "Path B source pin: $SHA"
            echo "TAG=${SHA:0:10}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest

      - name: Record amd64 manifest digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${{ env.TAG }}" \
            | grep -oP 'sha256:[0-9a-f]{64}' | head -1 || \
          docker buildx imagetools inspect "$IMAGE:${{ env.TAG }}" | grep -E 'sha256:[0-9a-f]{64}' | head -1)
          echo "Digest: $DIGEST"
          {
            echo "### Pushed image"
            echo ""
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo ""
            echo "Pin this linux/amd64 manifest digest in"
            echo "services/ai-chatbot/metamcp/docker-compose.yml."
          } >> "$GITHUB_STEP_SUMMARY"